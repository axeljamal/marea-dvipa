<script>window.PROPOSAL = {"slug":"grove-collection","quoteUrl":"https://marea-dvipa.uk/quote/","client":{"name":"The Grove Collection","url":"https://the-grove-collection.com","host":"Dominic","date":"7 November 2026","headline":"The Grove Collection already feels like home. Booking it should too.","intro":"We audited the-grove-collection.com and the two property sites it links to, the way we audit every site: from the raw HTML, against fourteen technical checks and the eight questions a platform listing always answers. The craft is there. What is missing is the moment of booking: no price anywhere, availability on another company’s domain, and the guest’s consent never asked. Below are three ways to fix that, each with a working mock-up you can click through."},"brand":{"cream":"#f4f0e6","sand":"#e7e0d2","forest":"#243026","moss":"#465048","sage":"#71816d","clay":"#a74f35","white":"#fffefa","serif":"Source Serif 4","sans":"Inter"},"rightTitle":"Six things most hospitality sites get wrong, and this one gets right","right":[{"t":"Light and fast","d":"The home page is 133 KB of HTML with 16 scripts. Airbnb’s own listing page is 590 KB with 64."},{"t":"Accessibility basics","d":"A skip link, reduced-motion support, every image with alt text and en-GB on the hub."},{"t":"Real reviews, with names and dates","d":"The Coach House site shows 4.9 from 19 reviews and quotes guests by name and date."},{"t":"A newsletter with a reason","d":"\"Friends of The Grove Collection\" promises offers and first news. It is the repeat-booking channel the platforms withhold."},{"t":"A concierge idea","d":"Plan My Stay asks who is coming, your pace and your interests. It currently runs on an external ChatGPT site; it belongs on the house."},{"t":"A voice","d":"\"Three places. Three distinct rhythms.\" The copy is confident and specific."}],"checks":[{"name":"Page weight","found":"133 KB, 16 scripts, 6 stylesheets","result":"pass"},{"name":"Image alt text","found":"8 of 8 images with alt"," <script>
(function(){
'use strict';
const C=window.PROPOSAL;const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const fam=[ 'Cormorant Garamond:ital,wght@0,500;0,600;0,700;1,500','Karla:wght@400;500;600','IBM Plex Mono:wght@400;500'];
if(C.brand.serif&&!/Cormorant/i.test(C.brand.serif))fam.push(C.brand.serif.replace(/ /g,'+')+':wght@400;600');

const b=C.brand;root.style.setProperty('--g-cream',b.cream);root.style.setProperty('--g-cream-2',b.cream2||b.cream);root.style.setProperty('--g-sand',b.sand);root.style.setProperty('--g-forest',b.forest);root.style.setProperty('--g-moss',b.moss);root.style.setProperty('--g-sage',b.sage);root.style.setProperty('--g-clay',b.clay);root.style.setProperty('--g-white',b.white||'#ffffff');root.style.setProperty('--g-serif',`"${b.serif||'Georgia'}",Georgia,serif`);root.style.setProperty('--g-sans',`"${b.sans||'Inter'}","Helvetica Neue",Arial,sans-serif`);

if(C.measured&&C.measured.length)secs.push(`<section id="numbers"><div class="sec-head"><span class="eyebrow">03 · Measured</span><h2>${esc(C.measuredTitle||'The site beside its neighbours')}</h2>${C.measuredNote?`<p class="lede">${esc(C.measuredNote)}</p>`:''}</div><div class="tbl"><table><thead><tr><th>Page</th><th class="num">HTML</th><th class="num">Scripts</th><th class="num">Stylesheets</th><th>Images without alt</th><th>Skip link</th><th>Reduced motion</th><th>lang</th><th>Structured data</th></tr></thead><tbody>${C.measured.map(m=>`<tr><td><b>${esc(m.page)}</b></td><td class="num">${esc(m.kb)} KB</td><td class="num">${esc(m.scripts)}</td><td class="num">${esc(m.css)}</td><td>${esc(m.noalt)}</td><td>${m.skip?'Yes':'No'}</td><td>${m.rm?'Yes':'No'}</td><td>${esc(m.lang)}</td><td>${esc(m.sd)}</td></tr>`).join('')}</tbody></table></div></section>`);
secs.push(`<section id="options"><div class="sec-head"><span class="eyebrow">04 · Three options</span><h2>${esc(C.optionsTitle||'Pick an option to see the page as it would be')}</h2><p class="lede">Each mock-up is drawn in ${esc(C.client.name)}'s own colours and type. Prices, dates and figures inside the mock-ups are examples except where they match the live site. Everything in the frame can be clicked.</p></div><div class="opts" role="tablist" id="optTabs"></div><div class="stage"><div class="frame"><div class="chrome"><i></i><i></i><i></i><span class="url" id="mockUrl"></span></div><div class="mock" id="mock"></div></div><aside class="side" id="side"></aside></div></section>`);

const P=C.payback;secs.push(`<section id="payback"><div class="sec-head"><span class="eyebrow">06 · Payback</span><h2>${esc(P.title||'Against what the business pays the platforms')}</h2><p class="lede">${esc(P.lede||`If direct bookings replace ${Math.round(P.shift*100)}% of what currently goes through a platform charging ${(P.fee*100).toFixed(1).replace(/\\.0$/,'')}%, this is how long each option takes to pay for itself. Move the slider to your own yearly booking income.`)}</p></div><div class="calc"><div class="card"><span class="eyebrow">Yearly booking income</span><div class="score" id="revOut"></div><input type="range" id="rev" min="${P.min||20000}" max="${P.max||300000}" step="5000" value="${P.rev}" aria-label="Yearly booking income"><p class="note">${esc(P.note||'')}</p></div><div class="card"><h4>Months to pay back the first-year cost</h4><div class="pb" id="pb"></div><p class="note" id="pbNote"></p></div></div></section>`);

$('#foot').innerHTML=`Marea Dvīpa · website guidance and design · <a href="https://marea-dvipa.uk">marea-dvipa.uk</a> · Audit figures as measured on ${esc(C.client.date)}; mock-up prices and dates are examples.`;

/* ---- interactive mock ---- */
let opt=C.options[Math.min(1,C.options.length-1)].id;
const st={nights:3,perks:true,house:0,consent:null,ans:'',story:0,wait:false,sel:[]};
const H=C.houses;
function calHtml(h){const days=['M','T','W','T','F','S','S'];const taken=new Set([2,3,9,10,11,17,24,25]);let s=days.map(d=>`<span class="h">${d}</span>`).join('');for(let d=1;d<=28;d++){const i=st.sel.indexOf(d);const inR=st.sel.length===2&&d>st.sel[0]&&d<st.sel[1];const cls=taken.has(d)?'x':(i>-1?'on':(inR?'in':''))+(d===4||d===12?' gap':'');s+=`<span class="${cls}" data-d="${d}" role="button" tabindex="${taken.has(d)?-1:0}">${d}</span>`}return `<div class="cal">${s}</div><div style="font-size:10.5px;color:var(--g-sage)">Grey: booked elsewhere, synced both ways. Red edge: single gap night, bookable outside the ${h.min}-night minimum.</div>`}
function priceCard(h,level){const n=st.sel.length===2?st.sel[1]-st.sel[0]:st.nights;const total=h.rate*n;const clean=C.cleaning||0;
 if(!h.rate)return `<div class="m-card"><div class="from">Coming soon <small>· register interest</small></div><p style="font-size:12px;color:var(--g-moss)">Be first to hear dates and opening rates for ${esc(h.n)}.</p>${st.wait?`<div style="font-size:12px;color:var(--g-forest);background:var(--g-cream);padding:8px;border-radius:5px">You are on the list. We write when dates open, nothing else.</div>`:`<input type="email" placeholder="you@example.com" aria-label="Email" style="font:12px var(--g-sans);padding:8px;border:1px solid var(--g-sand);border-radius:5px;width:100%"><button class="m-btn" data-act="wait">Join the waiting list</button>`}</div>`;

 return `<div class="m-card"><div class="from">${gbp(h.rate)} <small>a night · example rate</small></div><div class="m-row"><span>Nights</span><span class="step"><button data-act="dec" aria-label="Fewer nights">−</button><span>${n} night${n>1?'s':''}</span><button data-act="inc" aria-label="More nights">+</button></span></div><div class="m-row"><span>${gbp(h.rate)} × ${n}</span><span>${gbp(total)}</span></div>${clean?`<div class="m-row"><span>Cleaning</span><span>${gbp(clean)}</span></div>`:''}<div class="m-row" style="font-weight:600;border-top:1px solid var(--g-sand);padding-top:6px"><span>Total, no platform fee</span><span>${gbp(total+clean)}</span></div><div style="font-size:11px;color:var(--g-clay)">The same stay on a platform would cost you about ${gbp((total+clean)*(1+(C.guestFee||0.15)))} with the guest service fee.</div><div style="font-size:11.5px;color:var(--g-moss)">${esc(C.cancel||'Free cancellation until 14 days before arrival.')}</div><button class="m-btn">Hold these dates</button><button class="m-btn ghost">Pay with card · Stripe</button></div>`}
function renderMock(){const o=C.options.find(x=>x.id===opt);const h=H[st.house];const level=o.id;$('#mockUrl').textContent=h.url||C.client.url;
 const rating=h.count?`<span class="rating"><b>${esc(h.rating)}</b><span class="stars">★★★★★</span><span>${h.count} guest reviews${h.badge?' · '+esc(h.badge):''}</span></span>`:`<span class="pill">Coming soon</span>`;
 let html=`<div class="m-nav"><b>${esc(C.client.name)}</b><span>The house</span><span>Gallery</span><span>Location</span>${level==='c'?'<span>Ask the house</span>':'<span>Guide</span>'}<span class="cta">${level==='a'?'Check availability':'Book direct'}</span></div>`;
 if(level!=='a'&&H.length>1)html+=`<div class="props" role="group">${H.map((x,i)=>`<button type="button" data-house="${i}" aria-pressed="${i===st.house}">${esc(x.n)}</button>`).join('')}</div>`;
 html+=`<div class="m-hero"><div class="photo ${h.alt?'alt':''}"><span class="tag">${level==='c'?'▶ short film':'Photo'}</span>${esc(h.place)}</div><div class="m-copy"><span class="k">${esc(h.place)}</span><h5>${esc(h.n)}</h5>${rating}<p>${esc([h.sleeps,h.beds,h.extra].filter(Boolean).join(' · '))}</p>${level==='a'&&C.client.host?`<p>Hosted by ${esc(C.client.host)}. Replies within an hour, most days.</p>`:''}${priceCard(h,level)}</div></div>`;
 if(h.rate&&st.perks&&C.perks)html+=`<div class="perks">${C.perks.map(p=>`<div class="perk"><b>${esc(p.t)}</b>${esc(p.d)}</div>`).join('')}</div>`;
 if(level!=='a'&&h.rate)html+=`<div class="m-sec"><span class="k">Availability · example month</span>${calHtml(h)}</div>`;
 if(level==='c'&&h.rate&&h.stories&&h.stories.length){const s=Math.min(st.story,h.stories.length-1);html+=`<div class="m-sec"><span class="k">Walk the house</span><div class="tour">${h.stories.map((x,i)=>`<button type="button" class="hs" data-story="${i}" style="left:${18+i*30}%;top:${30+(i%2)*28}%" aria-label="${esc(x[0])}"></button>`).join('')}<div class="story"><b>${esc(h.stories[s][0])}</b> · ${esc(h.stories[s][1])}</div></div></div>`}
 if(level==='c'&&h.rate&&C.answers)html+=`<div class="m-sec"><span class="k">Ask the house</span><div class="chat"><div class="q">${Object.keys(C.answers).map(q=>`<button type="button" data-q="${esc(q)}">${esc(q)}</button>`).join('')}</div><div class="a">${st.ans?esc(C.answers[st.ans]):'Ask anything about '+esc(h.n)+', or let me plan your days.'}</div></div></div>`;
 html+=`<div class="m-sec"><span class="k">Location</span><div class="map"><span class="pin"></span>Approximate location shown until you book<div class="d">${esc(C.distances||'Distances to the beach, station and town')}</div></div></div>`;
 if(C.faq&&C.faq.length)html+=`<div class="m-sec faq"><span class="k">Good to know</span>${C.faq.map(f=>`<details><summary>${esc(f.q)}</summary>${esc(f.a)}</details>`).join('')}</div>`;
 if(st.consent===null)html+=`<div class="consent"><div style="flex:1;min-width:180px"><b>Cookies for analytics</b>Nothing loads until you choose.</div><button type="button" data-consent="all" class="p">Allow analytics</button><button type="button" data-consent="ess">Essentials only</button></div>`;
 else html+=`<div class="m-sec" style="font-size:11px;color:var(--g-sage)">Privacy choice saved: ${st.consent==='all'?'analytics allowed':'essentials only'}.</div>`;
 $('#mock').innerHTML=html;
 $('#side').innerHTML=`<h3>${esc(o.n)} <span class="score" style="font-size:1.6rem">${gbp(o.price)}</span>${o.mo?`<span class="mono quiet" style="font-size:.85rem">+ ${gbp(o.mo)}/month</span>`:''}</h3><p class="quiet">${esc(o.s)}</p><div class="card"><span class="eyebrow">What changes</span><div class="chk">${o.adds.map(a=>`<div class="new">${esc(a)}</div>`).join('')}</div></div><div class="card"><span class="eyebrow">What stays</span><div class="chk">${o.keeps.map(a=>`<div>${esc(a)}</div>`).join('')}</div><p class="note">${esc(o.fixes)}</p>${o.care?`<p class="note">${esc(o.care)}.</p>`:''}</div>`}
function renderTabs(){$('#optTabs').innerHTML=C.options.map(o=>`<button type="button" class="opt" role="tab" data-opt="${o.id}" aria-selected="${o.id===opt}"><span class="k">${esc(o.k)}</span><h3>${esc(o.n)}</h3><div class="price">${gbp(o.price)}</div><div class="mo">${o.mo?'+ '+gbp(o.mo)+' a month':'no monthly plan'}</div><p>${esc(o.s.split('. ')[0])}.</p></button>`).join('')}
$('#optTabs').addEventListener('click',e=>{const b=e.target.closest('[data-opt]');if(!b)return;opt=b.dataset.opt;if(opt==='a')st.house=Math.min(st.house,H.findIndex(h=>h.rate)>-1?Math.max(0,st.house):0);st.ans='';renderTabs();renderMock()});
$('#mock').addEventListener('click',e=>{const t=e.target.closest('[data-act],[data-house],[data-consent],[data-q],[data-story],[data-d]');if(!t)return;
 if(t.dataset.act==='inc')st.nights=Math.min(14,st.nights+1),st.sel=[];if(t.dataset.act==='dec')st.nights=Math.max(1,st.nights-1),st.sel=[];if(t.dataset.act==='wait')st.wait=true;
 if(t.dataset.house!=null)st.house=+t.dataset.house,st.sel=[],st.story=0,st.ans='';if(t.dataset.consent)st.consent=t.dataset.consent;if(t.dataset.q)st.ans=t.dataset.q;if(t.dataset.story!=null)st.story=+t.dataset.story;
 if(t.dataset.d&&!t.classList.contains('x')){const d=+t.dataset.d;if(st.sel.length!==1||d<=st.sel[0])st.sel=[d];else st.sel=[st.sel[0],d]}renderMock()});
$('#mock').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.dataset.d){e.preventDefault();e.target.click()}});
renderTabs();renderMock();
function payback(){const rev=+$('#rev').value;$('#revOut').textContent=gbp(rev);const saving=rev*P.shift*P.fee;const rows=C.options.map(o=>({n:o.n,m:(o.price+o.mo*12)/saving*12,rec:o.k.toLowerCase().includes('recommended')}));const max=Math.max(...rows.map(r=>r.m),12);
 $('#pb').innerHTML=rows.map(r=>`<div><span>${esc(r.n)}</span><i class="${r.rec?'hi':''}" style="width:${Math.min(100,r.m/max*100)}%"></i><span class="v">${r.m<1?'under a month':Math.round(r.m)+' months'}</span></div>`).join('');
 $('#pbNote').textContent=`Moving ${Math.round(P.shift*100)}% of ${gbp(rev)} away from a ${(P.fee*100).toFixed(1).replace(/\.0$/,'')}% fee saves about ${gbp(saving)} a year.`}
$('#rev').addEventListener('input',payback);payback();
})();
</script>
</body>
</html>
